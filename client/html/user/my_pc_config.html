<!doctype html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cấu hình của tôi - GameFit</title>
  <link rel="stylesheet" href="../../css/style.css" />
  <link rel="stylesheet" href="../../css/pages/user/my_pc_configs.css" />
  <link rel="stylesheet" href="../../css/components/cpu-gpu-combobox.css" />
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />
  <style>
    /* Bổ sung CSS cho nút Xóa và Top Button */
    .header-actions {
      margin-left: auto;
    }

    .btn-add-new {
      background-color: var(--primary);
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: var(--radius-md);
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: background-color 0.2s;
    }

    .btn-add-new:hover {
      background-color: var(--primary-hover);
    }

    .config-actions {
      display: flex;
      gap: 12px;
      margin-top: auto;
    }

    .btn-edit,
    .btn-delete {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      border: 1px solid var(--border-color);
    }

    .btn-edit {
      background-color: var(--bg-input);
      color: var(--text-primary);
    }

    .btn-edit:hover {
      background-color: var(--border-color);
    }

    .btn-delete {
      background-color: rgba(255, 77, 79, 0.1);
      color: var(--danger);
      border-color: rgba(255, 77, 79, 0.2);
    }

    .btn-delete:hover {
      background-color: rgba(255, 77, 79, 0.2);
    }

    .empty-state {
      text-align: center;
      grid-column: 1 / -1;
      padding: 60px 20px;
      color: var(--text-secondary);
    }

    .empty-state i {
      font-size: 48px;
      margin-bottom: 16px;
      color: var(--border-hover);
    }
  </style>
</head>

<body>
  <header>
    <!-- Navbar -->
    <div class="nav container">
      <a href="../home.html" class="logo">Game<span>Fit</span></a>
      <ul class="nav-links">
        <li><a href="../home.html">Home</a></li>
        <li><a href="../games.html">Games</a></li>
        <li><a href="../pc_config.html">PC Check</a></li>
      </ul>
      <div class="nav-icon">
        <div class="user-box">
          <span id="user-display-name" class="user-display-name"></span>
          <i class="bx bx-user" id="user-icon"></i>
          <!-- Dropdown Menu -->
          <div class="user-dropdown" id="user-dropdown">
            <div class="dropdown-header">
              <div class="user-avatar"><i class="bx bxs-user-circle"></i></div>
              <div class="user-info">
                <h4 id="dropdown-username">User</h4>
                <span id="dropdown-role" class="role-badge user">User</span>
              </div>
            </div>
            <ul class="dropdown-menu-list">
              <li class="menu-item logout-item">
                <a href="#" id="btn-logout">
                  <i class="bx bx-log-out"></i>
                  <span>Đăng xuất</span>
                </a>
              </li>
            </ul>
          </div>
        </div>
      </div>
    </div>
  </header>

  <div class="app-container" style="padding-top: 80px;">
    <main class="main-content">
      <div class="page-container" style="margin: 0 auto;">
        <div class="page-header" style="display: flex; align-items: center;">
          <div class="header-content" style="display: flex; align-items: center; gap: 16px;">
            <div class="header-icon">
              <i class="bx bx-desktop"></i>
            </div>
            <div>
              <h1 style="color: var(--primary); text-transform: uppercase;">Quản lý cấu hình máy tính của tôi</h1>
            </div>
          </div>
          <div class="header-actions">
            <button class="btn-add-new" id="btn-add-config-top">
              <i class="bx bx-plus"></i> Thêm cấu hình mới
            </button>
          </div>
        </div>

        <div class="configs-grid" id="configs-grid">
          <!-- Data will be loaded here via JS -->
          <div class="empty-state" id="loading-state">
            <i class="bx bx-loader-alt bx-spin"></i>
            <p>Đang tải danh sách cấu hình...</p>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Modal My PC Config -->
  <div class="modal-overlay" id="pc-config-overlay">
    <div class="modal-content modal-compact modal-scrollable">
      <div class="modal-header">
        <div class="modal-title">
          <i class="bx bx-desktop"></i>
          <div class="modal-title-text">
            <h2>Cấu hình máy tính của tôi</h2>
          </div>
        </div>
        <button type="button" class="btn-close" id="close-pc-config-modal">
          &times;
        </button>
      </div>
      <form id="pc-config-form">
        <div class="modal-body">
          <input type="hidden" id="pc-id" />
          <div class="form-group">
            <label class="form-label">Tên máy tính <span style="color: red">*</span></label>
            <input type="text" id="pc-name" class="form-control" required placeholder="Nhập tên máy tính..." />
          </div>
          <div class="form-group">
            <label class="form-label">Hệ điều hành</label>
            <input type="text" id="pc-os" class="form-control" placeholder="Ví dụ: Windows 10, Windows 11..." />
          </div>
          <div class="form-group">
            <label class="form-label">CPU <span style="color: red">*</span></label>
            <div class="hw-combobox" data-hw-type="cpu">
              <div class="hw-combobox-input-wrap">
                <input type="text" class="hw-combobox-text" data-hw-search placeholder="Nhập CPU..."
                  autocomplete="off" />
                <i class="bx bx-chevron-down hw-combobox-icon"></i>
              </div>
              <input type="hidden" id="pc-cpu" data-hw-id />
              <div class="hw-combobox-dropdown"></div>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">GPU <span style="color: red">*</span></label>
            <div class="hw-combobox" data-hw-type="gpu">
              <div class="hw-combobox-input-wrap">
                <input type="text" class="hw-combobox-text" data-hw-search placeholder="Nhập GPU..."
                  autocomplete="off" />
                <i class="bx bx-chevron-down hw-combobox-icon"></i>
              </div>
              <input type="hidden" id="pc-gpu" data-hw-id />
              <div class="hw-combobox-dropdown"></div>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">RAM (GB) <span style="color: red">*</span></label>
            <input type="number" id="pc-ram" class="form-control" required min="0"
              oninput="if(this.value < 0) this.value = 0;" placeholder="Nhập dung lượng RAM..." />
          </div>
          <div class="form-group">
            <label class="form-label">Lưu trữ (GB) <span style="color: red">*</span></label>
            <input type="number" id="pc-storage" class="form-control" required min="0"
              oninput="if(this.value < 0) this.value = 0;" placeholder="Nhập dung lượng lưu trữ..." />
          </div>
        </div>
        <div class="modal-footer" style="justify-content: flex-end; gap: 12px;">
          <button type="button" class="btn-secondary" id="cancel-pc-config-btn">
            Hủy
          </button>
          <button type="submit" class="btn-primary" style="background-color: var(--primary);">
            Lưu cấu hình
          </button>
        </div>
      </form>
    </div>
  </div>

  <div id="home-toast" class="home-toast"></div>

  <!-- Scripts -->
  <script src="../../js/utils/toast.js"></script>
  <script src="../../js/utils/auth-storage.js"></script>
  <script src="../../js/components/user-dropdown.js"></script>
  <script src="../../js/components/cpu-gpu-combobox.js"></script>
  <script src="../../js/pages/user/my_pc_config.js"></script>
</body>

</html>
