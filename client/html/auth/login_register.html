<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GameFit - Login / Register</title>
    <link rel="stylesheet" href="../../css/pages/auth/auth.css" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
    />
  </head>
  <body>
    <div class="wrapper">
      <form action="" id="LoginForm">
        <h1>Login</h1>
        <div class="input-box">
          <input
            type="email"
            id="login-username"
            placeholder="Email"
            required
          />
          <i class="bx bxs-user"></i>
        </div>
        <div class="input-box">
          <input
            type="password"
            id="login-password"
            placeholder="Password"
            required
          />
          <i class="bx bx-show" id="toggle-login-password"></i>
          <i class="bx bxs-lock-alt"></i>
        </div>
        <!-- <div class="remember-forgot">
          <label><input type="checkbox" />Remember me</label>
          <a href="#">Forgot Password</a>
        </div> -->
        <button type="submit" class="btn">Login</button>
        <div class="register-link">
          <p>Don't have an account? <a href="#" id="showSignup">Register</a></p>
        </div>
      </form>
      <form action="" id="SignUpForm">
        <h1>Sign Up</h1>
        <div class="input-box">
          <input
            type="text"
            id="signup-fullname"
            placeholder="Display Name"
            required
          />
          <i class="bx bxs-user"></i>
        </div>
        <div class="input-box">
          <input
            type="email"
            id="signup-username"
            placeholder="Email"
            required
          />
          <i class="bx bxs-user"></i>
        </div>
        <div class="input-box">
          <input
            type="password"
            id="signup-password"
            placeholder="Password"
            required
          />
          <i class="bx bx-show" id="toggle-signup-password"></i>
          <i class="bx bxs-lock-alt"></i>
        </div>
        <div class="input-box">
          <input
            type="password"
            id="signup-password-confirm"
            placeholder="Confirm Password"
            required
          />
          <i class="bx bx-show" id="toggle-signup-confirm"></i>
          <i class="bx bxs-lock-alt"></i>
        </div>
        <button type="submit" class="btn">Sign Up</button>
        <div class="register-link">
          <p>Already have an account? <a href="#" id="showLogin">Log in</a></p>
        </div>
      </form>
    </div>
    <div id="toast" class="toast"></div>

    <script src="../../js/utils/toast.js"></script>
    <script src="../../js/utils/auth-storage.js"></script>
    <script src="../../js/pages/auth.js"></script>
  </body>
</html>
