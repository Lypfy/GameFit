<!doctype html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GameFit - Forgot Password</title>
  <link rel="stylesheet" href="../../css/pages/auth/auth.css" />
  <link rel="stylesheet" href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" />
</head>

<body>
  <div class="wrapper">
    <form action="" id="ForgotPasswordForm">
      <h1>Forgot Password</h1>
      <p style="color: #fff; font-size: 0.9rem; text-align: center; margin-bottom: 20px;">
      </p>
      <div class="input-box">
        <input type="email" id="forgot-email" placeholder="Email address" required />
        <i class="bx bxs-envelope"></i>
      </div>
      <div class="input-box">
        <input type="password" id="forgot-new-password" placeholder="Mật khẩu mới" required />
        <i class="bx bx-show" id="toggle-forgot-password"
          style="position: absolute; right: 45px; top: 50%; transform: translateY(-50%); font-size: 20px; cursor: pointer; color: #fff;"></i>
        <i class="bx bxs-lock-alt"></i>
      </div>
      <div class="input-box">
        <input type="text" id="forgot-otp" placeholder="Mã OTP" required />
        <i class="bx bxs-key"></i>
      </div>

      <button type="button" id="btn-send-otp" class="btn"
        style="margin-bottom: 10px; background: rgba(255, 255, 255, 0.2); border: 1px solid #fff;">Gửi mã OTP</button>
      <button type="submit" class="btn">Khôi phục mật khẩu</button>
      <div class="register-link">
        <p>Remember your password? <a href="login_register.html">Log in</a></p>
      </div>
    </form>
  </div>
  <div id="toast" class="toast"></div>

  <script src="../../js/utils/toast.js" defer></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const togglePassword = document.getElementById("toggle-forgot-password");
      const passwordInput = document.getElementById("forgot-new-password");

      togglePassword.addEventListener("click", function () {
        const type = passwordInput.getAttribute("type") === "password" ? "text" : "password";
        passwordInput.setAttribute("type", type);
        this.classList.toggle("bx-show");
        this.classList.toggle("bx-hide");
      });

      const btnSendOtp = document.getElementById("btn-send-otp");
      btnSendOtp.addEventListener("click", async function () {
        const email = document.getElementById("forgot-email").value;
        if (!email) {
          if (typeof showToast === "function") showToast("Vui lòng nhập email trước!", "error");
          else alert("Vui lòng nhập email trước!");
          return;
        }

        const originalText = btnSendOtp.textContent;
        btnSendOtp.textContent = "Đang gửi...";
        btnSendOtp.disabled = true;

        try {
          const res = await fetch("http://localhost:5000/api/auth/forgot-password", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email })
          });
          const data = await res.json();

          if (data.success) {
            if (typeof showToast === "function") showToast("Đã gửi mã OTP vào email của bạn!", "success");
            else alert("Đã gửi mã OTP vào email của bạn!");
          } else {
            if (typeof showToast === "function") showToast(data.message || "Không thể gửi OTP", "error");
            else alert(data.message || "Không thể gửi OTP");
          }
        } catch (error) {
          console.error("Lỗi gửi OTP:", error);
          if (typeof showToast === "function") showToast("Lỗi kết nối server", "error");
        } finally {
          btnSendOtp.textContent = originalText;
          btnSendOtp.disabled = false;
        }
      });

      const form = document.getElementById("ForgotPasswordForm");
      const submitBtn = form.querySelector("button[type='submit']");
      form.addEventListener("submit", async function (e) {
        e.preventDefault();
        const email = document.getElementById("forgot-email").value;
        const otp = document.getElementById("forgot-otp").value;
        const newPassword = document.getElementById("forgot-new-password").value;

        if (!email || !otp || !newPassword) {
          if (typeof showToast === "function") showToast("Vui lòng điền đủ thông tin", "error");
          return;
        }

        const originalText = submitBtn.textContent;
        submitBtn.textContent = "Đang xử lý...";
        submitBtn.disabled = true;

        try {
          const res = await fetch("http://localhost:5000/api/auth/reset-password", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, otp, newPassword })
          });
          const data = await res.json();

          if (data.success) {
            if (typeof showToast === "function") {
              showToast("Khôi phục mật khẩu thành công!", "success");
              setTimeout(() => {
                window.location.href = "login_register.html";
              }, 2000);
            } else {
              alert("Khôi phục mật khẩu thành công!");
              window.location.href = "login_register.html";
            }
          } else {
            if (typeof showToast === "function") showToast(data.message || "OTP không đúng hoặc đã hết hạn", "error");
            else alert(data.message || "Lỗi khôi phục mật khẩu");
          }
        } catch (error) {
          console.error("Lỗi reset password:", error);
          if (typeof showToast === "function") showToast("Lỗi kết nối server", "error");
        } finally {
          submitBtn.textContent = originalText;
          submitBtn.disabled = false;
        }
      });
    });
  </script>
</body>

</html>
